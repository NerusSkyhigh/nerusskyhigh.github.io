site_name: Guglielmo Grillo's Personal Website
site_description: my personal website
site_url: http://guglielmogrillo.com/

# Navigation bar configuration
nav:
  - Homepage:         index.md
  - Resumè:
    - resume.md
    - In Details:
      - Awards: cv/awards-certificates.md
      - Education: cv/education-accademia.md
      - Skills: cv/skills.md
      - Work Experience: cv/work-experience.md
  #- Blog:             index.md
  - Projects:         projects.md
  #- PhD and Teaching: index.md
  #- Contact:          index.md
  

theme:
  custom_dir: theme_customizations
  name: material
  language: en
  features:
    - navigation.expand
    - navigation.indexes      # Avoid duplicate entries when using documents as sections
    - navigation.tabs         # Navigation tabs at the top of the page
    - navigation.top          # Move to the top of the page
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.code.select

docs_dir: sources
site_dir: generated_site

plugins:
  - search
#  - blog

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true 
      base_path: sources/codes
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - md_in_html
  - pymdownx.blocks.caption
  - neoteroi.timeline # https://www.neoteroi.dev/mkdocs-plugins/timeline/


extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - css/neoteroi-mkdocs.css # https://github.com/Neoteroi/mkdocs-plugins


# References:
#   https://squidfunk.github.io/mkdocs-material/reference
